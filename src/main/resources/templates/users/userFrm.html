<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
      
	<body>
		<div layout:fragment="content">
			<div th:replace="fragments/page-header-title.html :: page-header(#{usuarios.header.title})"></div>
		
			<div class="row">
              	<div class="col-lg-12 grid-margin">
					<div class="card">
                  		<div class="card-body">
                    		<h4 class="card-title">Horizontal Form</h4>
                    		<p class="card-description"> Horizontal form layout </p>
                    		<form class="forms-sample">
                      			<div class="form-group row">
                        			<label for="exampleInputUsername2" class="col-sm-3 col-form-label">Email</label>
				                        <div class="col-sm-9">
				                          <input type="text" class="form-control" id="exampleInputUsername2" placeholder="Username">
				                        </div>
                      			</div>

                      			<button id="saveBtn" type="submit" class="btn btn-primary me-2" th:text="#{save.btn}"></button>
                      			<button id="cancelBtn" type="button" onclick="$(cancelFrm).submit();" class="btn btn-dark" th:text="#{cancel.btn}"></button>
                    		</form>
                    		
                    		<form th:replace="fragments/cancel-form.html :: cancelFrm(@{/})" />
                  		</div>		
					</div>
              	</div>			
			</div>
		</div>
	</body>
</html>
